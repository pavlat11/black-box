name: Nasazení na web (FTP)

# Spouští se RUČNĚ: záložka Actions → "Nasazení na web (FTP)" → Run workflow.
# Samo se nic nenahrává.
on:
  workflow_dispatch:

concurrency:
  group: nasazeni-ftp
  cancel-in-progress: false

jobs:
  nasadit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zkontrolovat nastavení (tajné klíče)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in S U P; do
            if [ -z "${!v}" ]; then
              echo "::error::Chybí FTP údaje (Settings → Secrets and variables → Actions): FTP_SERVER, FTP_USER, FTP_PASSWORD."
              exit 1
            fi
          done

      - name: Ověřit spojení s FTP serverem
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          case "$S" in *://*|*/*|*:*|*" "*) echo "::error::FTP_SERVER má obsahovat jen název serveru (např. ftp.example.cz) – bez ftp://, lomítek, portu a mezer."; exit 1;; esac
          echo "DNS:"; getent hosts "$S" | awk '{print "  IP " $1}' || { echo "::error::Název FTP serveru nejde přeložit (DNS) – zkontrolujte FTP_SERVER."; exit 1; }
          echo "Uvítací zpráva serveru (port 21):"
          timeout 15 bash -c "exec 3<>/dev/tcp/$S/21 && head -c 300 <&3" | sed 's/^/  /' || echo "::warning::Server na portu 21 neodpověděl nebo spojení hned ukončil (možná blokuje připojení ze zahraničí / z GitHubu)."

      - name: Diagnostika přihlášení (dočasné)
        continue-on-error: true
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== FTP bez šifrování ==="; curl -sS -v --max-time 20 --user "$U:$P" "ftp://$S/" 2>&1 | grep -E '^[<>*]' | grep -v PASS | head -30 || true
          echo "=== FTPS (AUTH TLS) ==="; curl -sS -v --max-time 20 --ssl-reqd -k --user "$U:$P" "ftp://$S/" 2>&1 | grep -E '^[<>*]' | grep -v PASS | head -40 || true

      - name: Sestavit produkční web
        run: python3 tools/build_prod.py build

      - name: Nahrát na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          local-dir: build/
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}   # ftps (šifrované) / ftp
          security: loose                                  # sdílený hosting: certifikát nemusí sedět na název serveru
