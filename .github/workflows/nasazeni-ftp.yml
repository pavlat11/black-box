name: Nasazení na web (FTP)

# Spouští se RUČNĚ: záložka Actions → "Nasazení na web (FTP)" → Run workflow. Samo se nic nenahrává.
# Nahrává přes SFTP do /blackboxx.cz/web/ (lze změnit tajným klíčem FTP_DIR). Na serveru nic nemaže;
# config.php a data objednávek se nenahrávají (build je neobsahuje).
# Websupport/Active24: u FTP účtu musí Geo ochrana povolovat USA (GitHub Actions běží v USA).

# Cíl „test“ = testovací verze (dev/) na https://blackboxx.cz/test/ (neindexuje se, objednávky tam nefungují).
# Cíl „live“ = ostrý web https://blackboxx.cz/.
# „smazat-test“ = smaže složku /test/ na serveru (při dalším nahrání na test se vytvoří znovu).

on:
  workflow_dispatch:
    inputs:
      cil:
        description: 'Kam nahrát'
        type: choice
        options: [test, live, smazat-test]
        default: test

run-name: Nasazení – ${{ inputs.cil }}

concurrency:
  group: nasazeni-ftp
  cancel-in-progress: false

jobs:
  nasadit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zkontrolovat nastavení (tajné klíče)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in S U P; do
            if [ -z "${!v}" ]; then
              echo "::error::Chybí FTP údaje (Settings → Secrets and variables → Actions): FTP_SERVER, FTP_USER, FTP_PASSWORD."
              exit 1
            fi
          done
          case "$S" in *://*|*/*|*:*|*" "*) echo "::error::FTP_SERVER má obsahovat jen název serveru – bez ftp://, lomítek a portu."; exit 1;; esac

      - name: Sestavit web
        run: |
          if [ "${{ inputs.cil }}" = "live" ]; then
            python3 tools/build_prod.py build
          elif [ "${{ inputs.cil }}" = "smazat-test" ]; then
            mkdir -p build
          else
            python3 tools/build_prod.py build --dev --bez-serveru
          fi

      - name: Nahrát na server (SFTP)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_DIR || '/blackboxx.cz/web/' }}
        run: |
          pip install -q paramiko
          if [ "${{ inputs.cil }}" = "smazat-test" ]; then
            python3 tools/sftp_smazat.py test
          elif [ "${{ inputs.cil }}" = "live" ]; then
            python3 tools/sftp_upload.py build
            echo "Hotovo – ostrý web nahrán do $D (https://blackboxx.cz/)"
          else
            python3 tools/sftp_upload.py build test
            echo "Hotovo – testovací verze nahrána do ${D%/}/test/ (https://blackboxx.cz/test/)"
          fi
